<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Board + Digital Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid #eee;
        }

        .tab-button {
            flex: 1;
            padding: 15px;
            background: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #666;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: #f8f9ff;
        }

        .content {
            padding: 20px;
            min-height: 400px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Clock Styles */
        .clocks-grid {
            display: grid;
            gap: 15px;
        }

        .clock-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .clock-city {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .clock-time {
            font-size: 32px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        .clock-date {
            font-size: 12px;
            opacity: 0.8;
        }

        .add-timezone {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .add-timezone select {
            flex: 1;
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 14px;
        }

        .add-timezone button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .add-timezone button:hover {
            background: #764ba2;
        }

        /* Job Board Styles */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-add {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .jobs-list {
            margin-top: 20px;
        }

        .job-card {
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            position: relative;
        }

        .job-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .job-company {
            font-size: 14px;
            color: #666;
            margin-bottom: 3px;
        }

        .job-details {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }

        .job-salary {
            color: #2ecc71;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .job-type {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 5px;
        }

        .btn-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn-delete:hover {
            background: #c0392b;
            transform: scale(1.1);
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 14px;
        }

        .empty-message-emoji {
            font-size: 40px;
            margin-bottom: 10px;
        }

        @media (max-width: 480px) {
            .clock-time {
                font-size: 28px;
            }

            .job-card {
                padding: 12px;
            }

            .form-group input,
            .form-group select,
            .form-group textarea {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 My Apps</h1>
            <p>⏰ Часы + 💼 Доска объявлений</p>
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('clock')">⏰ Часы</button>
            <button class="tab-button" onclick="switchTab('jobs')">💼 Вакансии</button>
        </div>

        <div class="content">
            <!-- Clock Tab -->
            <div id="clock" class="tab-content active">
                <div class="clocks-grid" id="clocksGrid"></div>
                
                <div class="add-timezone">
                    <select id="timezoneSelect">
                        <option value="">+ Добавить часовой пояс</option>
                        <option value="America/New_York">🗽 Нью-Йорк (EST)</option>
                        <option value="Europe/London">🇬🇧 Лондон (GMT)</option>
                        <option value="Europe/Paris">🇫🇷 Париж (CET)</option>
                        <option value="Europe/Moscow">🇷🇺 Москва (MSK)</option>
                        <option value="Asia/Dubai">🇦🇪 Дубай (GST)</option>
                        <option value="Asia/Bangkok">🇹🇭 Бангкок (ICT)</option>
                        <option value="Asia/Shanghai">🇨🇳 Шанхай (CST)</option>
                        <option value="Asia/Tokyo">🇯🇵 Токио (JST)</option>
                        <option value="Australia/Sydney">🇦🇺 Сидней (AEDT)</option>
                        <option value="Pacific/Auckland">🇳🇿 Окленд (NZDT)</option>
                        <option value="America/Los_Angeles">🌴 Лос-Анджелес (PST)</option>
                        <option value="America/Chicago">🇺🇸 Чикаго (CST)</option>
                        <option value="America/Denver">⛰️ Денвер (MST)</option>
                        <option value="America/Anchorage">❄️ Анкоридж (AKST)</option>
                        <option value="Pacific/Honolulu">🌺 Гонолулу (HST)</option>
                        <option value="Asia/Hong_Kong">🇭🇰 Гонконг (HKT)</option>
                        <option value="Asia/Singapore">🇸🇬 Сингапур (SGT)</option>
                        <option value="Asia/Manila">🇵🇭 Манила (PHT)</option>
                        <option value="Asia/Seoul">🇰🇷 Сеул (KST)</option>
                        <option value="Asia/Kolkata">🇮🇳 Дели (IST)</option>
                        <option value="Middle_East/Tehran">🇮🇷 Тегеран (IRST)</option>
                        <option value="Africa/Cairo">🇪🇬 Каир (EET)</option>
                        <option value="Africa/Johannesburg">🇿🇦 Йоханнесбург (SAST)</option>
                        <option value="America/Sao_Paulo">🇧🇷 Сан-Паулу (BRT)</option>
                        <option value="America/Buenos_Aires">🇦🇷 Буэнос-Айрес (ART)</option>
                        <option value="Europe/Istanbul">🇹🇷 Стамбул (EET)</option>
                        <option value="Asia/Jakarta">🇮🇩 Джакарта (WIB)</option>
                    </select>
                    <button onclick="addTimezone()">Добавить</button>
                </div>
            </div>

            <!-- Jobs Tab -->
            <div id="jobs" class="tab-content">
                <form onsubmit="addJob(event)">
                    <div class="form-group">
                        <label>Должность *</label>
                        <input type="text" id="jobTitle" placeholder="Например: Разработчик" required>
                    </div>

                    <div class="form-group">
                        <label>Компания *</label>
                        <input type="text" id="jobCompany" placeholder="Название компании" required>
                    </div>

                    <div class="form-group">
                        <label>Город *</label>
                        <input type="text" id="jobLocation" placeholder="Например: Москва" required>
                    </div>

                    <div class="form-group">
                        <label>Тип работы *</label>
                        <select id="jobType" required>
                            <option value="">Выберите тип</option>
                            <option value="Full-time">Full-time</option>
                            <option value="Part-time">Part-time</option>
                            <option value="Фриланс">Фриланс</option>
                            <option value="Контракт">Контракт</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Зарплата (опционально)</label>
                        <input type="text" id="jobSalary" placeholder="Например: 100 000 - 150 000 руб.">
                    </div>

                    <div class="form-group">
                        <label>Описание</label>
                        <textarea id="jobDescription" placeholder="Опишите требования и обязанности..."></textarea>
                    </div>

                    <button type="submit" class="btn-add">+ Добавить вакансию</button>
                </form>

                <div class="jobs-list" id="jobsList"></div>
            </div>
        </div>
    </div>

    <script>
        // Clock functionality
        const defaultTimezones = [
            { name: '🇷🇺 Москва', tz: 'Europe/Moscow' },
            { name: '🗽 Нью-Йорк', tz: 'America/New_York' },
            { name: '🇬🇧 Лондон', tz: 'Europe/London' },
            { name: '🇯🇵 Токио', tz: 'Asia/Tokyo' },
            { name: '🇦🇺 Сидней', tz: 'Australia/Sydney' },
        ];

        let timezones = JSON.parse(localStorage.getItem('timezones')) || defaultTimezones;
        let jobs = JSON.parse(localStorage.getItem('jobs')) || [];

        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));

            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'clock') {
                updateClocks();
            } else {
                renderJobs();
            }
        }

        function updateClocks() {
            const grid = document.getElementById('clocksGrid');
            grid.innerHTML = '';

            timezones.forEach((item, index) => {
                const now = new Date().toLocaleString('en-US', {
                    timeZone: item.tz,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });

                const date = new Date().toLocaleString('en-US', {
                    timeZone: item.tz,
                    weekday: 'short',
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });

                const card = document.createElement('div');
                card.className = 'clock-card';
                card.innerHTML = `
                    <div class="clock-city">${item.name}</div>
                    <div class="clock-time">${now}</div>
                    <div class="clock-date">${date}</div>
                    <button class="btn-delete" onclick="removeTimezone(${index})" style="top: 5px; right: 5px;">✕</button>
                `;
                grid.appendChild(card);
            });
        }

        function addTimezone() {
            const select = document.getElementById('timezoneSelect');
            const tz = select.value;

            if (!tz) {
                alert('Выберите часовой пояс');
                return;
            }

            const tzName = select.options[select.selectedIndex].text;
            
            if (timezones.some(t => t.tz === tz)) {
                alert('Этот часовой пояс уже добавлен');
                return;
            }

            timezones.push({ name: tzName, tz: tz });
            localStorage.setItem('timezones', JSON.stringify(timezones));
            select.value = '';
            updateClocks();
        }

        function removeTimezone(index) {
            timezones.splice(index, 1);
            localStorage.setItem('timezones', JSON.stringify(timezones));
            updateClocks();
        }

        // Job Board functionality
        function addJob(e) {
            e.preventDefault();

            const job = {
                id: Date.now(),
                title: document.getElementById('jobTitle').value,
                company: document.getElementById('jobCompany').value,
                location: document.getElementById('jobLocation').value,
                type: document.getElementById('jobType').value,
                salary: document.getElementById('jobSalary').value,
                description: document.getElementById('jobDescription').value,
                date: new Date().toLocaleDateString('ru-RU')
            };

            jobs.unshift(job);
            localStorage.setItem('jobs', JSON.stringify(jobs));

            // Clear form
            e.target.reset();
            renderJobs();
            alert('✅ Вакансия добавлена!');
        }

        function deleteJob(id) {
            if (confirm('Удалить вакансию?')) {
                jobs = jobs.filter(j => j.id !== id);
                localStorage.setItem('jobs', JSON.stringify(jobs));
                renderJobs();
            }
        }

        function renderJobs() {
            const list = document.getElementById('jobsList');

            if (jobs.length === 0) {
                list.innerHTML = `
                    <div class="empty-message">
                        <div class="empty-message-emoji">💼</div>
                        <p>Нет вакансий. Добавьте первую!</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = jobs.map(job => `
                <div class="job-card">
                    <button class="btn-delete" onclick="deleteJob(${job.id})">✕</button>
                    <div class="job-title">${job.title}</div>
                    <div class="job-company">${job.company}</div>
                    <div class="job-details">📍 ${job.location} | 📅 ${job.date}</div>
                    <div class="job-salary">${job.salary || 'Зарплата не указана'}</div>
                    <div>
                        <span class="job-type">${job.type}</span>
                    </div>
                    ${job.description ? `<div style="margin-top: 8px; font-size: 13px; color: #555;">${job.description}</div>` : ''}
                </div>
            `).join('');
        }

        // Initialize
        window.addEventListener('load', () => {
            updateClocks();
            renderJobs();
            setInterval(updateClocks, 1000);
        });
    </script>
</body>
</html>
